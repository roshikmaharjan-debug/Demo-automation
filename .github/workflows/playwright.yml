name: Playwright Tests
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Chromium
        # Every project uses Chromium, so the other browsers are not needed.
        run: npx playwright install --with-deps chromium
      - name: Check formatting
        run: npm run format:check
      - name: Write evaire credentials
        id: evaire
        env:
          EVAIRE_USER_CREDENTIALS: ${{ secrets.EVAIRE_USER_CREDENTIALS }}
        run: |
          if [ -n "$EVAIRE_USER_CREDENTIALS" ]; then
            printf '%s' "$EVAIRE_USER_CREDENTIALS" > tests/evaire/data/userCredentials.json
            echo "projects=" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::EVAIRE_USER_CREDENTIALS secret is not set; skipping the evaire tests."
            echo "projects=--project=saucedemo --project=api" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Playwright tests
        run: npx playwright test ${{ steps.evaire.outputs.projects }}
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          API_USERNAME: ${{ secrets.API_USERNAME }}
          API_PASSWORD: ${{ secrets.API_PASSWORD }}

      - name: Remove evaire credentials
        if: ${{ always() }}
        run: rm -f tests/evaire/data/userCredentials.json

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: test-results
          path: test-results/
          retention-days: 7
